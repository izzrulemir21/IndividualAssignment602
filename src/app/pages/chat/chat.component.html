<style>
  main {
    /* Replace 'assets/26318.jpg' with the actual path to your image file */
    background: url('assets/26318.jpg') no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    padding: 20px 0;
  }

  /* Ensures the chat area stays white and stands out from the stars */
  .card {
    background-color: white !important;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }

  h3 {
    color: white; /* Makes the title readable against the dark background */
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  }
</style>

<main>
  <div class="container">
    <h3 class="mb-3">Welcome to a EMIR CHAT! 
      <button (click)="logOut()" class="btn btn-secondary" style="float: right;">Log out</button>
    </h3>
    
    <div class="card">
      <div class="col-12">
        <div style="max-height: 70vh; overflow-y: auto;">
          @for (msg of this.chats(); track msg) {
          <div class="position-relative">
            <div class="chat-messages p-4">
              <div class="chat-message-left pb-4 d-flex">
                <div class="me-3 text-center">
                  <img [src]="msg?.users?.avatar_url" class="rounded-circle mr-1" [alt]="msg?.users?.full_name" width="40" height="40">
                  <div class="text-muted small text-nowrap mt-2">{{msg?.created_at | date: 'M/d/yy, h:mm a'}}</div>
                </div>
                <div class="flex-shrink-1 bg-light rounded py-2 px-3 ml-3">
                  <div class="font-weight-bold mb-1">{{msg?.users?.full_name}}</div>
                  {{msg?.text}}
                </div>
                <div class="dropdown">
                  <span (click)="openDropDown(msg)" class="ms-2" type="button" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false" style="cursor: pointer;">
                    ...
                  </span>
                  <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1">
                    <li>
                      <a class="dropdown-item text-danger" href="#" data-bs-toggle="modal" data-bs-target="#exampleModal">Delete</a>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
          } @empty {
          <div class="p-4 text-center text-muted">No chats available</div>
          }
        </div>

        <form [formGroup]="chatForm" (ngSubmit)="onSubmit()">
          <div class="flex-grow-0 py-3 px-4 border-top bg-white">
            <div class="input-group">
              <input formControlName="chat_message" type="text" class="form-control" placeholder="Type your message">
              <button [disabled]="!chatForm.valid" class="btn btn-primary">Send</button>
            </div>
          </div>
        </form>

      </div>
    </div>
  </div>
</main>

<app-delete-modal />
